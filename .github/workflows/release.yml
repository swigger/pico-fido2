name: Firmware and controller release

on:
  push:
    tags: ['controller-v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'New Release tag (created at the selected commit)'
        required: true
        type: string
      prerelease:
        description: 'Mark as a prerelease'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: controller-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  firmware:
    name: ESP32-S3 firmware (build once)
    runs-on: ubuntu-22.04
    container: espressif/idf:v5.5.6
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Build and package firmware
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          . /opt/esp/idf/export.sh
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git submodule foreach --recursive 'git config --global --add safe.directory "$PWD"'
          python build_firmware_and_controller.py --firmware-only --version "$RELEASE_VERSION" --jobs 4
      - uses: actions/upload-artifact@v4
        with:
          name: firmware
          path: dist/firmware/
          if-no-files-found: error

  controller:
    name: Controller (${{ matrix.os }})
    needs: firmware
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-22.04
          - os: windows-2022
            qt_arch: win64_msvc2022_64
          - os: macos-15
            qt_arch: clang_64
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-go@v6
        with:
          go-version-file: tools/relay-storage/go.mod
          cache-dependency-path: tools/relay-storage/go.sum
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
        with:
          arch: x64
      - name: Install Linux development and deployment tools
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build pkg-config patchelf qt6-base-dev qt6-base-dev-tools libsecret-1-dev libudev-dev libgl1-mesa-dev
      - uses: jurplel/install-qt-action@v4
        if: runner.os != 'Linux'
        with:
          version: '6.8.3'
          arch: ${{ matrix.qt_arch }}
          cache: true
      - name: Install common build tools
        run: python -m pip install 'cmake==3.31.6' 'ninja==1.11.1.4'
      - uses: actions/cache@v4
        with:
          path: build/firmware-controller/dependencies
          key: controller-notices-${{ runner.os }}-qt-6.8.3-linux-6.2.4-v1
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: dist/firmware
      - name: Script regression checks
        run: python -m unittest discover -s tools -p test_build_firmware_and_controller.py -v
      - name: Build and package controller with shared firmware
        shell: bash
        env:
          RELEASE_VERSION: ${{ inputs.tag || github.ref_name }}
        run: |
          image=(dist/firmware/esp32s3supermini-*.bin)
          python build_firmware_and_controller.py --firmware "${image[0]}" --version "$RELEASE_VERSION" --jobs 4
      - uses: actions/upload-artifact@v4
        with:
          name: controller-${{ matrix.os }}
          path: |
            dist/PicoFido2-*.zip
            dist/PicoFido2-*.tar.gz
            dist/PicoFido2-*.sha256
          if-no-files-found: error

  release:
    name: Publish Release
    needs: [firmware, controller]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: controller-*
          path: release-assets
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: firmware
          path: firmware
      - name: Publish verified packages
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          tar -czf "release-assets/PicoFido2-${RELEASE_TAG}-firmware.tar.gz" firmware
          cd release-assets
          sha256sum --check ./*.sha256
          sha256sum ./*.zip ./*.tar.gz > SHA256SUMS
          cd ..
          cat > release-notes.txt <<'EOF'
          ESP32-S3 relay firmware and native controllers built by build_firmware_and_controller.py.

          - Windows x64: unzip and run Esp32KeyConfirm.exe.
          - macOS: unzip and open Pico FIDO Controller.app (native runner architecture, ad-hoc signed, not notarized).
          - Linux x64: extract and run Esp32KeyConfirm. Built on Ubuntu 22.04; requires a desktop Secret Service and USB hidraw access.
          - All desktop packages include the same merged firmware, the CLI, storage helper and LICENSES directory (inside Contents/Resources on macOS).
          - The separate firmware archive also includes the app, bootloader and partition-table images. Merged factory images are for blank devices; see the repository update instructions before updating a populated key.

          SHA256SUMS covers every downloadable package. Each package also contains its source commit and file checksums.
          EOF
          options=()
          if [ "$PRERELEASE" = true ]; then options+=(--prerelease); fi
          gh release create "$RELEASE_TAG" release-assets/* --target "$GITHUB_SHA" \
            --title "Pico FIDO2 ${RELEASE_TAG}" --notes-file release-notes.txt "${options[@]}"
